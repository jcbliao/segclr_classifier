# Our config for the lab's DeepResNet baseline (segCLR_cell_classification),
# adapted from their configs/resnet.yaml -- points at our generated HDF5
# (scripts/generate_lab_baseline_hdf5.py) instead of theirs, and runs through
# scripts/lab_baseline_train.py so our exact train/val/test split is used
# (see that script's docstring) instead of their internal random 2-way split.

experiment_name: lab_baseline_resnet_our_data
seed: 42

trainer:
  type: base

data:
  path: /home/jcbliao/rotation/segclr/gnn_classifier/data/lab_baseline_aggregated_25um.h5
  train_split: 0.8   # unused with our split override, kept for schema completeness
  batch_size: 32
  normalize: true
  ood_filter: null
  use_coarse: false  # our labels have no dash-hierarchy to collapse -- see
                      # scripts/generate_lab_baseline_hdf5.py's docstring;
                      # coarse_cell_types is a duplicate of cell_types, so this
                      # just makes the (identical) choice explicit rather than
                      # silently relying on which array happens to get read.
  # NOT `true` -- their own configs/resnet.yaml uses the YAML boolean `true`,
  # but CellTypingDataset.__init__ only branches on the STRINGS "sample" or
  # "loss"; a bare True matches neither `if == "sample"` nor `elif == "loss"`,
  # leaving `sampler` unassigned -> UnboundLocalError at DataLoader
  # construction. Confirmed by actually hitting this crash. "loss" (class-
  # weighted cross-entropy) matches the semantics used everywhere else in
  # this project.
  weight_imbalanced_classes: "loss"
  lazy_loading: false

model:
  type: resnet
  hidden_layers: 4
  hidden_size: 128

training:
  num_epochs: 100

optimizer:
  type: adam
  lr: 0.001

scheduler:
  type: step
  step_size: 10

loss:
  type: cross_entropy

validation:
  every_n_epochs: 1

analysis:
  every_n_epochs: 5

checkpointing:
  save_every_n_epochs: 5
  resume_from: null
